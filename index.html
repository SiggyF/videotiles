<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoTiles - Synchronized Recursive Video Map (15 Levels Deep)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      min-width: 320px;
    }
    #controls h2 {
      margin: 0 0 10px 0;
      font-size: 17px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      font-weight: normal;
      background: #0284c7;
      color: white;
      padding: 2px 7px;
      border-radius: 12px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    select:focus, button:focus {
      border-color: #38bdf8;
    }
    button.primary {
      background: #0284c7;
      border-color: #0369a1;
      font-weight: 600;
      width: auto;
      min-width: 70px;
    }
    button.primary:hover {
      background: #0369a1;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      color: #cbd5e1;
    }
    .info-grid strong {
      color: #38bdf8;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h2>Recursive Video Tiles <span class="badge">Zoom 0 → 18</span></h2>
    
    <div class="control-group">
      <label for="pattern-select">Selecteer Recursief Patroon</label>
      <select id="pattern-select"></select>
    </div>

    <div class="info-grid">
      <div>Zoom: <strong id="zoom-level">0.00</strong></div>
      <div>Zichtbare tegels: <strong id="tile-count">0</strong></div>
    </div>

    <div class="control-group" style="margin-bottom: 14px;">
      <button id="play-btn" class="primary" style="width: 100%;">Pause</button>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="toggle-grid" checked />
      Toon tegelgrenzen & XYZ-coördinaten
    </label>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
